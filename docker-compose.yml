services:

  # ==========================================================
  # NEO4J KNOWLEDGE GRAPH
  # ==========================================================

  neo4j:
    image: neo4j:5-community
    container_name: hybrid-kg-rag-neo4j

    restart: unless-stopped

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

    # Neo4j is intentionally NOT published to the VPS.
    # Backend communicates with it through the private network.

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - hybrid-rag-network


  # ==========================================================
  # FASTAPI BACKEND
  # ==========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: hybrid-kg-rag-backend
    container_name: hybrid-kg-rag-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Use the internal Neo4j Docker service.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j

      # Persistent application paths.
      UPLOAD_DIR: /app/data/uploads
      FAISS_DIR: /app/data/faiss
      MEMORY_DB_PATH: /app/data/memory/conversations.db

      APP_ENV: production

    # FastAPI is intentionally NOT published publicly.
    # Streamlit reaches it through the private Docker network.

    volumes:
      - backend_uploads:/app/data/uploads
      - backend_faiss:/app/data/faiss
      - backend_memory:/app/data/memory

    depends_on:
      neo4j:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - hybrid-rag-network


  # ==========================================================
  # STREAMLIT FRONTEND
  # ==========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: hybrid-kg-rag-frontend
    container_name: hybrid-kg-rag-frontend

    restart: unless-stopped

    environment:
      BACKEND_URL: http://backend:8000

    # Traefik runs with host networking.
    # Bind Streamlit only to localhost so it is not directly
    # exposed to the public internet.
    ports:
      - "127.0.0.1:8501:8501"

    depends_on:
      backend:
        condition: service_healthy

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.hybrid-rag.rule=Host(`www.hybridrag.space`)"
      - "traefik.http.routers.hybrid-rag.entrypoints=websecure"
      - "traefik.http.routers.hybrid-rag.tls=true"
      - "traefik.http.routers.hybrid-rag.tls.certresolver=letsencrypt"

      - "traefik.http.services.hybrid-rag.loadbalancer.server.url=http://127.0.0.1:8501"

    networks:
      - hybrid-rag-network


# ============================================================
# PERSISTENT VOLUMES
# ============================================================

volumes:

  neo4j_data:
    name: hybrid-kg-rag-neo4j-data

  neo4j_logs:
    name: hybrid-kg-rag-neo4j-logs

  backend_uploads:
    name: hybrid-kg-rag-uploads

  backend_faiss:
    name: hybrid-kg-rag-faiss

  backend_memory:
    name: hybrid-kg-rag-memory


# ============================================================
# APPLICATION NETWORK
# ============================================================

networks:

  hybrid-rag-network:
    name: hybrid-kg-rag-network
    driver: bridge
